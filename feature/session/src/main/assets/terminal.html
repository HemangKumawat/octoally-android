<!doctype html>
<html><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<link rel="stylesheet" href="xterm/xterm.css"/>
<style>
  html,body{margin:0;padding:0;background:#0f1117;height:100%;width:100%;overflow:hidden;color:#e4e8f1;
            touch-action:pan-y;}
  #term{height:100%;width:100%;touch-action:pan-y;}
  /* rc17 — claim vertical pan via touch-action so the browser doesn't try
     to scroll on its own and conflict with our JS handler. */
  .xterm-viewport{background:#0f1117 !important;touch-action:pan-y;}
  .xterm-screen,.xterm{touch-action:pan-y;}
</style>
</head><body>
<div id="term"></div>
<script src="xterm/xterm.js"></script>
<script src="xterm/xterm-addon-fit.js"></script>
<script src="xterm/xterm-addon-search.js"></script>
<script>
(function(){
  // rc10 production — xterm render surface. No WebSocket here; Kotlin owns
  // the socket and feeds us base64 via window.__octo.write. Mirror of
  // dashboard Terminal.tsx lines 139-171 (theme), 173-175 + 209-211 (fit),
  // 265-276 (RAF batching).
  var THEME = {
    background:'#0f1117', foreground:'#e4e8f1',
    cursor:'#0f1117', cursorAccent:'#0f1117',
    selectionBackground:'#3b82f680',
    black:'#1a1d27', red:'#ef4444', green:'#22c55e', yellow:'#eab308',
    blue:'#3b82f6', magenta:'#a855f7', cyan:'#06b6d4', white:'#e4e8f1',
    brightBlack:'#4b5563', brightRed:'#f87171', brightGreen:'#4ade80',
    brightYellow:'#fde047', brightBlue:'#60a5fa', brightMagenta:'#c084fc',
    brightCyan:'#22d3ee', brightWhite:'#f9fafb'
  };
  var term = new Terminal({
    cursorBlink:false, cursorStyle:'bar', cursorWidth:1,
    cursorInactiveStyle:'none',
    fontSize:10, fontFamily:"'JetBrains Mono','Courier New',monospace",
    scrollback:5000, allowProposedApi:true,
    theme:THEME
  });
  var fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  // rc21 — search addon over the 5000-line scrollback (board 1.2, the
  // no-server LOW-risk daily-driver win). Same UMD/loadAddon pattern as
  // FitAddon; bundled (no network). Failure to construct must NOT break
  // the terminal — guard it so a bad addon load can't black-body the surface.
  var search = null;
  try {
    if (window.SearchAddon && SearchAddon.SearchAddon) {
      search = new SearchAddon.SearchAddon();
      term.loadAddon(search);
    } else {
      console.log('WV_SEARCH_ERR addon-missing');
    }
  } catch(se) { console.log('WV_SEARCH_ERR '+se.message); search = null; }
  term.open(document.getElementById('term'));

  // rc17 touch-scroll rewrite. Three changes vs rc15/16:
  //  1. Bind to the .xterm-viewport (the actual scrollable div xterm renders
  //     INSIDE term.element). The wrapper element has a floating textarea-
  //     helper on top that absorbs touchstart in some configurations.
  //  2. Accumulate fractional lines (dy/cellH) instead of Math.trunc per move.
  //     Old code dropped any drag smaller than one cell-height (~15-22px),
  //     making short flicks feel dead.
  //  3. Diagnostic console.log on touchstart so logcat can prove the handler
  //     is firing (look for "WV_TOUCH start" in TerminalWebView log).
  (function attachTouchScroll(){
    var el = term.element.querySelector('.xterm-viewport') || term.element;
    if (!el) return;
    var lastY = 0, vel = 0, lastT = 0, momentumId = 0;
    var lineAcc = 0;
    function cellH() {
      try {
        var h = term._core._renderService.dimensions.css.cell.height;
        if (typeof h === 'number' && h > 0) return h;
      } catch(e) {}
      try {
        var r = el.getBoundingClientRect();
        if (r.height > 0 && term.rows > 0) return r.height / term.rows;
      } catch(e) {}
      return 16;
    }
    el.addEventListener('touchstart', function(e){
      if (e.touches.length !== 1) { cancelAnimationFrame(momentumId); return; }
      cancelAnimationFrame(momentumId);
      lastY = e.touches[0].clientY; lastT = Date.now(); vel = 0; lineAcc = 0;
      console.log('WV_TOUCH start cellH=' + cellH().toFixed(1) + ' rows=' + term.rows);
    }, {passive:true});
    el.addEventListener('touchmove', function(e){
      if (e.touches.length !== 1) return;  // pinch — let it through
      var y = e.touches[0].clientY, now = Date.now();
      var dy = lastY - y;
      lineAcc += dy / cellH();
      if (Math.abs(lineAcc) >= 1) {
        var whole = Math.trunc(lineAcc);
        term.scrollLines(whole);
        lineAcc -= whole;
      }
      vel = (lastY - y) / Math.max(1, now - lastT);
      lastY = y;
      lastT = now;
      if (e.cancelable) e.preventDefault();
    }, {passive:false});
    el.addEventListener('touchend', function(){
      function step(){
        if (Math.abs(vel) < 0.05) return;
        var lines = Math.trunc(vel * 16 / cellH());
        if (lines !== 0) term.scrollLines(lines);
        vel *= 0.92;
        momentumId = requestAnimationFrame(step);
      }
      momentumId = requestAnimationFrame(step);
    }, {passive:true});
  })();

  // RAF-batched writes — collapses bursty PTY output into one paint frame.
  var pendingChunks = [];
  var pendingBytes = 0;
  var rafId = null;
  var flushTaps = 0;
  function flushChunks(){
    rafId = null;
    if (pendingChunks.length === 0) return;
    var drained = pendingChunks.length;
    for (var i=0; i<pendingChunks.length; i++) term.write(pendingChunks[i]);
    pendingChunks = [];
    pendingBytes = 0;
    flushTaps += drained;
    // Belt-and-suspenders log tap (rc10-exec-accelerators.md §4.1):
    // every ~500 drained chunks, announce liveness to Kotlin/logcat.
    if (flushTaps >= 500) {
      console.log('WV_FLUSH taps='+flushTaps+' cols='+term.cols+' rows='+term.rows);
      flushTaps = 0;
    }
  }

  window.__octo = {
    write: function(b64){
      try {
        var bin = atob(b64);
        var len = bin.length;
        var u8 = new Uint8Array(len);
        for (var i=0; i<len; i++) u8[i] = bin.charCodeAt(i);
        pendingChunks.push(u8);
        pendingBytes += len;
        // Soft cap: drop front of queue if we exceed 2MB pending (§6 #2).
        if (pendingBytes > 2000000) {
          while (pendingChunks.length > 1 && pendingBytes > 1000000) {
            pendingBytes -= pendingChunks.shift().length;
          }
        }
        if (rafId === null) rafId = requestAnimationFrame(flushChunks);
      } catch (e) {
        console.log('WV_WRITE_ERR '+e.message);
      }
    },
    sys: function(text){
      try { term.write(text); } catch(e) { console.log('WV_SYS_ERR '+e.message); }
    },
    clear: function(){ term.clear(); },
    cols: function(){ return term.cols; },
    rows: function(){ return term.rows; },
    refit: function(){
      try { fit.fit(); } catch(e) {}
      return term.cols + 'x' + term.rows;
    },
    scrollToBottom: function(){
      try { term.scrollToBottom(); } catch(e) {}
    },
    // rc16 — pinch-zoom font size. Caller passes integer 8..28.
    setFontSize: function(px){
      try {
        var n = Math.max(7, Math.min(28, px | 0));
        term.options.fontSize = n;
        fit.fit();
        console.log('WV_FONT_SIZE '+n+' cols='+term.cols+' rows='+term.rows);
        return n;
      } catch(e) { console.log('WV_FONT_ERR '+e.message); return -1; }
    },
    // rc21 — find-in-scrollback (board 1.2). No silent catch: any error
    // is logged WV_SEARCH_ERR so a broken search can't pass unnoticed.
    findNext: function(q){
      try {
        if (!search || !q) return false;
        return !!search.findNext(String(q), { caseSensitive:false, decorations:{
          matchOverviewRuler:'#eab308', activeMatchColorOverviewRuler:'#22c55e' } });
      } catch(e) { console.log('WV_SEARCH_ERR next '+e.message); return false; }
    },
    findPrev: function(q){
      try {
        if (!search || !q) return false;
        return !!search.findPrevious(String(q), { caseSensitive:false, decorations:{
          matchOverviewRuler:'#eab308', activeMatchColorOverviewRuler:'#22c55e' } });
      } catch(e) { console.log('WV_SEARCH_ERR prev '+e.message); return false; }
    },
    clearSearch: function(){
      try { if (search && search.clearDecorations) search.clearDecorations(); }
      catch(e) { console.log('WV_SEARCH_ERR clear '+e.message); }
    }
  };

  // First fit MUST run after layout — RAF defer, then announce ready.
  requestAnimationFrame(function(){
    try { fit.fit(); } catch(e) { console.log('WV_FIT_ERR '+e.message); }
    var cols = term.cols, rows = term.rows;
    if (!cols || cols < 2 || isNaN(cols)) cols = 80;
    if (!rows || rows < 2 || isNaN(rows)) rows = 24;
    setTimeout(function(){
      console.log('WV_READY cols='+cols+' rows='+rows);
      // rc21 — render-regression tripwire (board BS-2 mitigation, made
      // executable). The Phase-4 emulator gate greps WV_TRIPWIRE: it FAILS
      // the ship if "WV_TRIPWIRE ok" is absent or "WV_TRIPWIRE FAIL" present.
      // Asserts the three historical rc10-14 failure modes can't ship blind:
      //   (i)  body background is the dark theme (not the black-body bug)
      //   (ii) cols/rows are sane (not the garbage-dims clamp path)
      //   (iii) the xterm element exists with non-zero bounds (WebView surface)
      // NO silent catch — any throw emits WV_TRIPWIRE FAIL so the gate blocks.
      try {
        var realCols = term.cols, realRows = term.rows;
        var bg = '';
        try { bg = (window.getComputedStyle(document.body).backgroundColor || ''); } catch(e2) { bg = ''; }
        // rgb(15, 17, 23) === #0f1117 (the theme bg). A black-body regression
        // renders rgb(0, 0, 0) or transparent — both fail this.
        var bgOk = (bg.replace(/\s+/g,'') === 'rgb(15,17,23)');
        var dimsOk = (typeof realCols === 'number' && realCols >= 2 && !isNaN(realCols) &&
                      typeof realRows === 'number' && realRows >= 2 && !isNaN(realRows));
        var elOk = !!(term.element && term.element.offsetHeight > 0 && term.element.offsetWidth > 0);
        if (bgOk && dimsOk && elOk) {
          console.log('WV_TRIPWIRE ok bg='+bg.replace(/\s+/g,'')+' cols='+realCols+' rows='+realRows+
                      ' h='+term.element.offsetHeight);
        } else {
          console.log('WV_TRIPWIRE FAIL bgOk='+bgOk+'('+bg+') dimsOk='+dimsOk+
                      '(cols='+realCols+',rows='+realRows+') elOk='+elOk);
        }
      } catch(tw) {
        console.log('WV_TRIPWIRE FAIL exception='+tw.message);
      }
    }, 0);
  });
})();
</script>
</body></html>
